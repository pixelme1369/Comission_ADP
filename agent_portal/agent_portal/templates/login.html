{% extends "base.html" %}
{% block title %}Log in — ADP Agent Portal{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Log in</h1>
  <p class="muted">See your own commission history — periods, cleared/pending clients, and clawbacks.</p>
</div>

<form method="post" class="card" style="max-width:400px; padding:1.5rem;">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
  </div>
  <button type="submit" class="btn btn-primary">Log in</button>
</form>
{% endblock %}
